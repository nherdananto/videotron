services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/dev.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — see .env.example}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    volumes:
      - videotron-db:/data
    restart: unless-stopped

volumes:
  videotron-db:
